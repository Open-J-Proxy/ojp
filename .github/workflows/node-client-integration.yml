name: Node client integration

on:
  push:
    branches: [main, 'lts/**']
  pull_request:
    branches: [main, 'lts/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ./.github/workflows/ci-test-selection.yml
    with:
      full-suite: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}

  integration:
    needs: detect-changes
    if: needs.detect-changes.outputs.node == 'true' || needs.detect-changes.outputs.node_typeorm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: node_test
          MYSQL_USER: nodeuser
          MYSQL_PASSWORD: nodepassword
          MYSQL_ROOT_PASSWORD: rootpassword
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: node_test
          MARIADB_USER: nodeuser
          MARIADB_PASSWORD: nodepassword
          MARIADB_ROOT_PASSWORD: rootpassword
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3307:3306
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ojp-node-driver/package-lock.json

      - name: Install, build and run unit tests
        if: needs.detect-changes.outputs.node == 'true' || needs.detect-changes.outputs.node_typeorm == 'true'
        working-directory: ojp-node-driver
        run: |
          npm ci
          npm run build
          npm test -- --runInBand

      - name: Build Node driver for TypeORM adapter
        if: needs.detect-changes.outputs.node_typeorm == 'true' && needs.detect-changes.outputs.node != 'true'
        working-directory: ojp-node-driver
        run: |
          npm ci
          npm run build

      - name: Install, build and run TypeORM adapter unit tests
        if: needs.detect-changes.outputs.node_typeorm == 'true'
        working-directory: ojp-node-typeorm-adapter
        run: |
          npm ci
          npm run build
          npm test -- --runInBand

      - name: Build OJP server
        run: ./mvnw -q -pl ojp-server -am install -DskipTests -Dgpg.skip=true

      - name: Download JDBC drivers
        run: |
          mkdir -p ojp-libs
          curl -fsSL https://repo.maven.apache.org/maven2/com/h2database/h2/2.3.232/h2-2.3.232.jar -o ojp-libs/h2.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/postgresql/postgresql/42.7.8/postgresql-42.7.8.jar -o ojp-libs/postgresql.jar
          curl -fsSL https://repo.maven.apache.org/maven2/com/mysql/mysql-connector-j/8.4.0/mysql-connector-j-8.4.0.jar -o ojp-libs/mysql-connector-j.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/mariadb/jdbc/mariadb-java-client/3.5.3/mariadb-java-client-3.5.3.jar -o ojp-libs/mariadb-java-client.jar
          curl -fsSL https://repo.maven.apache.org/maven2/com/microsoft/sqlserver/mssql-jdbc/12.8.2.jre11/mssql-jdbc-12.8.2.jre11.jar -o ojp-libs/mssql-jdbc.jar

      - name: Start databases
        run: |
          password="NodeTest!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          prefix="ojp-node-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "OJP_TEST_PASSWORD=$password"
            echo "OJP_TEST_SQLSERVER_PASSWORD=$password"
            echo "NODE_TEST_PREFIX=$prefix"
          } >> "$GITHUB_ENV"
          docker run -d --name "$prefix-postgres" --network host \
            -e POSTGRES_USER=nodeuser -e POSTGRES_DB=node_test \
            -e POSTGRES_PASSWORD="$password" postgres:17 -c max_prepared_transactions=100
          docker run -d --name "$prefix-sqlserver" --network host \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 90); do
            if docker exec "$prefix-postgres" pg_isready -U nodeuser -d node_test >/dev/null 2>&1 &&
               docker exec "$prefix-sqlserver" /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P "$password" -C -b -Q 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 90 ]; then
              docker logs "$prefix-postgres"
              docker logs "$prefix-sqlserver"
              exit 1
            fi
            sleep 2
          done
          docker exec "$prefix-sqlserver" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$password" -C -b -Q 'CREATE DATABASE node_test'
          docker exec "$prefix-sqlserver" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$password" -C -b -d master -Q 'EXEC sp_sqljdbc_xa_install;'

      - name: Grant MySQL XA recovery permission
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -prootpassword \
            -e "GRANT XA_RECOVER_ADMIN ON *.* TO 'nodeuser'@'%';"

      - name: Start OJP servers
        run: |
          jar=$(find "$PWD/ojp-server/target" -maxdepth 1 -name 'ojp-server-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          test -n "$jar"
          for index in 1 2 3; do
            port=$((1058 + index))
            metrics=$((9158 + index))
            docker run -d --name "$NODE_TEST_PREFIX-$index" --network host \
              -v "$jar:/opt/ojp/server.jar:ro" -v "$PWD/ojp-libs:/opt/ojp-libs:ro" \
              eclipse-temurin:25-jre java -Duser.timezone=UTC \
              -Dojp.server.port="$port" -Dojp.prometheus.port="$metrics" \
              -Dojp.libs.path=/opt/ojp-libs -jar /opt/ojp/server.jar
          done
          for index in 1 2 3; do
            for attempt in $(seq 1 60); do
              if docker logs "$NODE_TEST_PREFIX-$index" 2>&1 | grep -q 'OJP gRPC Server started'; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker logs "$NODE_TEST_PREFIX-$index"
                exit 1
              fi
              sleep 1
            done
          done
          docker run -d --name "$NODE_TEST_PREFIX-postgres-l8-throttled" --network host \
            -v "$jar:/opt/ojp/server.jar:ro" -v "$PWD/ojp-libs:/opt/ojp-libs:ro" \
            eclipse-temurin:25-jre java -Duser.timezone=UTC \
            -Dojp.server.port=1062 -Dojp.prometheus.port=9165 \
            -Dojp.server.maxConcurrentRequests=1 -Dojp.libs.path=/opt/ojp-libs \
            -jar /opt/ojp/server.jar
          for attempt in $(seq 1 60); do
            if docker logs "$NODE_TEST_PREFIX-postgres-l8-throttled" 2>&1 | grep -q 'OJP gRPC Server started'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$NODE_TEST_PREFIX-postgres-l8-throttled"
              exit 1
            fi
            sleep 1
          done
          echo "OJP_TEST_NODE_CONTAINERS=$NODE_TEST_PREFIX-1,$NODE_TEST_PREFIX-2,$NODE_TEST_PREFIX-3" >> "$GITHUB_ENV"
          {
            echo "OJP_TEST_POSTGRES_L8_THROTTLED_NODE_CONTAINER=$NODE_TEST_PREFIX-postgres-l8-throttled"
            echo "OJP_TEST_POSTGRES_L8_THROTTLED_NODE_PORT=1062"
            echo "OJP_TEST_L8_THROTTLED_NODE_CONTAINER=$NODE_TEST_PREFIX-postgres-l8-throttled"
            echo "OJP_TEST_L8_THROTTLED_NODE_PORT=1062"
          } >> "$GITHUB_ENV"

      - name: Start two SQL Server mTLS OJP servers
        run: |
          jar=$(find "$PWD/ojp-server/target" -maxdepth 1 -name 'ojp-server-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          test -n "$jar"
          cert_dir="$RUNNER_TEMP/ojp-node-mtls-certs"
          bash scripts/generate-jdbc-mtls-test-certificates.sh "$cert_dir"
          chmod 755 "$cert_dir"
          chmod 644 "$cert_dir/server-keystore.p12" "$cert_dir/server-truststore.p12"
          keystore_password_property=ojp.server.tls.keystore.pass""word
          truststore_password_property=ojp.server.tls.truststore.pass""word
          test_store_password=ojp-test-only
          for index in 1 2; do
            port=$((10590 + index))
            metrics=$((9162 + index))
            docker run -d --name "$NODE_TEST_PREFIX-mtls-$index" --network host \
              -v "$jar:/opt/ojp/server.jar:ro" -v "$PWD/ojp-libs:/opt/ojp-libs:ro" \
              -v "$cert_dir:/etc/ojp/mtls:ro" \
              --env JAVA_TOOL_OPTIONS="-Duser.timezone=UTC -Dojp.server.port=$port -Dojp.prometheus.port=$metrics -Dojp.libs.path=/opt/ojp-libs -Dojp.server.tls.enabled=true -Dojp.server.tls.keystore.path=/etc/ojp/mtls/server-keystore.p12 -D${keystore_password_property}=${test_store_password} -Dojp.server.tls.keystore.type=PKCS12 -Dojp.server.tls.truststore.path=/etc/ojp/mtls/server-truststore.p12 -D${truststore_password_property}=${test_store_password} -Dojp.server.tls.truststore.type=PKCS12 -Dojp.server.tls.clientAuthRequired=true" \
              eclipse-temurin:25-jre java -jar /opt/ojp/server.jar
            for attempt in $(seq 1 60); do
              if docker logs "$NODE_TEST_PREFIX-mtls-$index" 2>&1 | grep -q 'OJP gRPC Server started'; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker logs "$NODE_TEST_PREFIX-mtls-$index"
                exit 1
              fi
              sleep 1
            done
          done
          {
            echo "OJP_TEST_MTLS_NODE_CONTAINERS=$NODE_TEST_PREFIX-mtls-1,$NODE_TEST_PREFIX-mtls-2"
            echo "OJP_TEST_MTLS_NODE_ENDPOINTS=localhost:10591,localhost:10592"
            echo "OJP_TEST_MTLS_CERT_DIR=$cert_dir"
          } >> "$GITHUB_ENV"

      - name: Start two PostgreSQL mTLS OJP servers
        run: |
          jar=$(find "$PWD/ojp-server/target" -maxdepth 1 -name 'ojp-server-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          test -n "$jar"
          cert_dir="$RUNNER_TEMP/ojp-node-mtls-certs"
          keystore_password_property=ojp.server.tls.keystore.pass""word
          truststore_password_property=ojp.server.tls.truststore.pass""word
          test_store_password=ojp-test-only
          for index in 1 2; do
            port=$((10592 + index))
            metrics=$((9165 + index))
            docker run -d --name "$NODE_TEST_PREFIX-postgres-mtls-$index" --network host \
              -v "$jar:/opt/ojp/server.jar:ro" -v "$PWD/ojp-libs:/opt/ojp-libs:ro" \
              -v "$cert_dir:/etc/ojp/mtls:ro" \
              --env JAVA_TOOL_OPTIONS="-Duser.timezone=UTC -Dojp.server.port=$port -Dojp.prometheus.port=$metrics -Dojp.libs.path=/opt/ojp-libs -Dojp.server.tls.enabled=true -Dojp.server.tls.keystore.path=/etc/ojp/mtls/server-keystore.p12 -D${keystore_password_property}=${test_store_password} -Dojp.server.tls.keystore.type=PKCS12 -Dojp.server.tls.truststore.path=/etc/ojp/mtls/server-truststore.p12 -D${truststore_password_property}=${test_store_password} -Dojp.server.tls.truststore.type=PKCS12 -Dojp.server.tls.clientAuthRequired=true" \
              eclipse-temurin:25-jre java -jar /opt/ojp/server.jar
            for attempt in $(seq 1 60); do
              if docker logs "$NODE_TEST_PREFIX-postgres-mtls-$index" 2>&1 | grep -q 'OJP gRPC Server started'; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker logs "$NODE_TEST_PREFIX-postgres-mtls-$index"
                exit 1
              fi
              sleep 1
            done
          done
          {
            echo "OJP_TEST_POSTGRES_L10_MTLS_CONTAINERS=$NODE_TEST_PREFIX-postgres-mtls-1,$NODE_TEST_PREFIX-postgres-mtls-2"
            echo "OJP_TEST_POSTGRES_L10_MTLS_ENDPOINTS=localhost:10593,localhost:10594"
            echo "OJP_TEST_MYSQL_MARIADB_L10_MTLS_CONTAINERS=$NODE_TEST_PREFIX-postgres-mtls-1,$NODE_TEST_PREFIX-postgres-mtls-2"
            echo "OJP_TEST_MYSQL_MARIADB_L10_MTLS_ENDPOINTS=localhost:10593,localhost:10594"
          } >> "$GITHUB_ENV"

      - name: Run every client integration suite
        if: needs.detect-changes.outputs.node == 'true'
        working-directory: ojp-node-driver
        env:
          OJP_TEST_H2: 'true'
          OJP_TEST_H2_ADDR: localhost:1059
          OJP_ENABLE_LOB_H2_TESTS: 'true'
          OJP_ENABLE_INTEGRATION_TESTS: 'true'
          OJP_ENABLE_MYSQL_TESTS: 'true'
          OJP_ENABLE_MARIADB_TESTS: 'true'
          OJP_ENABLE_MYSQL_L7_TESTS: 'true'
          OJP_ENABLE_MARIADB_L7_TESTS: 'true'
          OJP_ENABLE_MYSQL_L8_TESTS: 'true'
          OJP_ENABLE_MARIADB_L8_TESTS: 'true'
          OJP_ENABLE_MYSQL_L9_TESTS: 'true'
          OJP_ENABLE_MARIADB_L9_TESTS: 'true'
          OJP_ENABLE_MYSQL_L10_TESTS: 'true'
          OJP_ENABLE_MARIADB_L10_TESTS: 'true'
          OJP_ENABLE_POSTGRES_L7_TESTS: 'true'
          OJP_ENABLE_POSTGRES_L8_TESTS: 'true'
          OJP_ENABLE_POSTGRES_L10_TESTS: 'true'
          OJP_ENABLE_XA_TESTS: 'true'
          OJP_ENABLE_SQLSERVER_AG_TESTS: 'true'
          OJP_ENABLE_SQLSERVER_L6_TESTS: 'true'
          OJP_ENABLE_SQLSERVER_L5_TESTS: 'true'
          OJP_ENABLE_SQLSERVER_L4_TESTS: 'true'
          OJP_ENABLE_SQLSERVER_L7_TESTS: 'true'
          OJP_ENABLE_SQLSERVER_L8_TESTS: 'true'
          OJP_ENABLE_SQLSERVER_L10_TESTS: 'true'
          OJP_ENABLE_SQLSERVER_XA_TESTS: 'true'
          OJP_ENABLE_MULTINODE_FAILOVER_TESTS: 'true'
        run: |
          npm run test:integration:all -- --json --outputFile="$RUNNER_TEMP/node-integration.json"
          node -e "const r=require(process.argv[1]); if (r.numFailedTests > 0 || r.numFailedTestSuites > 0 || r.numRuntimeErrorTestSuites > 0) process.exit(1)" "$RUNNER_TEMP/node-integration.json"

      - name: Run TypeORM adapter integration suites
        if: needs.detect-changes.outputs.node_typeorm == 'true'
        working-directory: ojp-node-typeorm-adapter
        env:
          OJP_ENABLE_INTEGRATION_TESTS: 'true'
          OJP_ENABLE_SQLSERVER_AG_TESTS: 'true'
        run: |
          npm run test:integration:all -- --json --outputFile="$RUNNER_TEMP/typeorm-integration.json"
          node -e "const r=require(process.argv[1]); if (r.numFailedTests > 0 || r.numFailedTestSuites > 0 || r.numRuntimeErrorTestSuites > 0) process.exit(1)" "$RUNNER_TEMP/typeorm-integration.json"

      - name: Show logs and clean up test containers
        if: always() && env.NODE_TEST_PREFIX != ''
        run: |
          for name in "$NODE_TEST_PREFIX-1" "$NODE_TEST_PREFIX-2" "$NODE_TEST_PREFIX-3" "$NODE_TEST_PREFIX-postgres-l8-throttled" "$NODE_TEST_PREFIX-mtls-1" "$NODE_TEST_PREFIX-mtls-2" "$NODE_TEST_PREFIX-postgres-mtls-1" "$NODE_TEST_PREFIX-postgres-mtls-2" "$NODE_TEST_PREFIX-postgres" "$NODE_TEST_PREFIX-sqlserver"; do
            docker logs "$name" 2>&1 || true
            docker rm -f "$name" || true
          done
