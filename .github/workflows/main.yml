  # ===========================================================================
  # JOB 6: DB2 Integration Tests  
  # ===========================================================================
  #
  # This job tests IBM DB2 database integration.
  # DB2 is an enterprise-grade database system from IBM.
  #
  # Database: IBM DB2 11.5.8.0
  # Matrix strategy: Tests against Java 11, 17, 21, 25
  # Execution: Runs after all selected Main CI H2 jobs succeed.
  #
  # Note: DB2 container is large and takes longer to start up.
  #
  # ===========================================================================
  db2-test:
    name: DB2 Tests (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    # DEPENDENCY: This job waits until every selected Main CI H2 job succeeds.
    needs: [detect-changes, h2-integration-gate, resolve-version]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java == 'true' && needs.h2-integration-gate.result == 'success' && needs.resolve-version.result == 'success' }}

    strategy:
      fail-fast: false
      matrix:
        java-version: [ 11, 17, 21, 25 ]

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Start DB2 container (note: this is a large container and takes time to start)
      - name: Start DB2
        run: |
          docker run --name ojp-db2 \
            -e LICENSE=accept \
            -e DB2INSTANCE=db2inst1 \
            -e DB2INST1_PASSWORD=testpass \
            -e DBNAME=testdb \
            -e AUTOCONFIG=false \
            -e ARCHIVE_LOGS=false \
            -p 50000:50000 \
            --privileged=true \
            -d ibmcom/db2:11.5.8.0
          
          # Wait for DB2 to be ready with proper health check (can take 5-10 minutes)
          echo "Waiting for DB2 to start (this may take several minutes)..."
          
          # Check Docker logs for the "Setup has completed" message indicating DB2 is ready
          MAX_WAIT=600  # 10 minutes
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            if docker logs ojp-db2 2>&1 | grep -q "Setup has completed"; then
              echo "DB2 setup completed after $ELAPSED seconds"
              break
            fi
            echo "Still waiting for DB2... ($ELAPSED seconds elapsed)"
            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done
          
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "ERROR: DB2 did not start within $MAX_WAIT seconds"
            echo "Last 50 lines of DB2 logs:"
            docker logs ojp-db2 2>&1 | tail -50
            exit 1
          fi
          
          # Give DB2 time to fully initialize after setup message
          echo "DB2 setup complete, waiting for database activation..."
          sleep 60
          
          # Activate the database and verify connectivity
          echo "Activating DB2 database testdb..."
          docker exec ojp-db2 su - db2inst1 -c "db2 activate database testdb" || echo "Activation command issued"
          sleep 10
          
          # Test connectivity to ensure DB2 is ready
          echo "Testing DB2 connectivity..."
          MAX_CONN_WAIT=120
          CONN_ELAPSED=0
          while [ $CONN_ELAPSED -lt $MAX_CONN_WAIT ]; do
            if docker exec ojp-db2 su - db2inst1 -c "db2 connect to testdb user db2inst1 using testpass" 2>&1 | grep -q "Database Connection Information"; then
              echo "DB2 is accepting connections after $CONN_ELAPSED seconds"
              docker exec ojp-db2 su - db2inst1 -c "db2 disconnect testdb" || true
              break
            fi
            echo "DB2 not ready yet, waiting... ($CONN_ELAPSED seconds)"
            sleep 10
            CONN_ELAPSED=$((CONN_ELAPSED + 10))
          done
          
          if [ $CONN_ELAPSED -ge $MAX_CONN_WAIT ]; then
            echo "WARNING: DB2 connectivity test timed out, but continuing..."
            docker logs ojp-db2 2>&1 | tail -50
          fi
          
          echo "DB2 initialization complete"

      # Download DB2 JDBC driver and place in ojp-server/ojp-libs directory for inclusion in the Docker image
      # Similar to Oracle, we handle it via the ojp-libs directory copied into the Docker image
      - name: Download DB2 JDBC Driver to ojp-server/ojp-libs
        run: |
          # Create ojp-server/ojp-libs directory for inclusion in the Docker image
          mkdir -p ojp-server/ojp-libs
          
          # Download DB2 JDBC driver from Maven Central
          echo "=== Downloading DB2 JDBC driver ==="
          mvn dependency:copy \
            -Dartifact=com.ibm.db2:jcc:11.5.9.0 \
            -DoutputDirectory=ojp-server/ojp-libs \
            -Dmdep.stripVersion=false
          
          # Verify the download
          echo "=== DB2 JDBC driver downloaded to ojp-server/ojp-libs ==="
          ls -lh ojp-server/ojp-libs/

      - name: Set up JDK 25 for build
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons) with JDK 25
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Test (ojp-grpc-commons) with JDK 25
        run: mvn test -pl ojp-grpc-commons -Dgpg.skip=true

      # Download open source JDBC drivers into ojp-server/ojp-libs for inclusion in the Docker image
      - name: Download Open Source Drivers
        run: bash ojp-server/download-drivers.sh ./ojp-server/ojp-libs

      - name: Build (ojp-server) with JDK 25
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Build OJP Server Docker image
        run: |
          docker build -t ${{ needs.resolve-version.outputs.ojp_image }} ojp-server/
          echo "OJP_IMAGE=${{ needs.resolve-version.outputs.ojp_image }}" >> $GITHUB_ENV

      - name: Start OJP Server container with DB2 driver from ojp-server/ojp-libs
        run: |
          docker run -d --name ojp-server \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}

      - name: Wait for ojp-server to start
        run: sleep 10

      - name: Set up JDK ${{ matrix.java-version }} for ojp-jdbc-driver
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build (ojp-jdbc-driver) with JDK ${{ matrix.java-version }}
        run: mvn clean install -pl ojp-jdbc-driver -am -DskipTests -Dgpg.skip=true

      # Run DB2-specific tests with -DenableDb2Tests flag
      - name: Test (ojp-jdbc-driver) with DB2 enabled
        run: mvn test -pl ojp-jdbc-driver -Dgpg.skip=true -DenableDb2Tests=true

      - name: Show ojp-server.log
        if: always()
        run: docker logs ojp-server 2>&1 || echo "ojp-server container not found"

  # ===========================================================================
  # JOB 7: Multinode Integration Tests
  # ===========================================================================
  #
  # This job tests multinode functionality with TWO OJP server instances.
  # It verifies failover and recovery scenarios by:
  # 1. Starting two OJP servers on different ports (10591, 10592)
  # 2. Running tests that use both servers simultaneously
  # 3. Killing servers one at a time and verifying failover
  # 4. Restarting servers and verifying recovery
  #
  # Database: PostgreSQL (for multinode connection pooling tests)
  # Execution: Runs after all selected Main CI H2 jobs succeed.
  #
  # ===========================================================================
  multinode-test:
    name: Multinode Integration Test (Run ${{ matrix.run }})
    runs-on: ubuntu-latest
    # DEPENDENCY: This job waits until every selected Main CI H2 job succeeds.
    needs: [detect-changes, h2-integration-gate, resolve-version]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java == 'true' && needs.h2-integration-gate.result == 'success' && needs.resolve-version.result == 'success' }}
    strategy:
      max-parallel: 1
      matrix:
        run: [1, 2, 3, 4, 5]

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Start PostgreSQL container for multinode tests
      # Configured with max_prepared_transactions=100 for XA support
      - name: Start Postgres
        run: |
          docker run --name ojp-postgres-multinode \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=defaultdb \
            -p 5432:5432 \
            -d postgres:17 \
            -c max_prepared_transactions=100
      
          # Wait for Postgres to become ready (up to 60s)
          timeout 60 bash -c 'until docker exec ojp-postgres-multinode pg_isready -U testuser -d defaultdb -h 127.0.0.1; do sleep 2; done'

          # Verify setting
          PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SHOW max_prepared_transactions;"

      - name: Set up JDK 25 for build
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons) with JDK 25
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Test (ojp-grpc-commons) with JDK 25
        run: mvn test -pl ojp-grpc-commons -Dgpg.skip=true

      # Download open source JDBC drivers into ojp-server/ojp-libs for inclusion in the Docker image
      - name: Download Open Source Drivers
        run: bash ojp-server/download-drivers.sh ./ojp-server/ojp-libs

      - name: Build (ojp-server) with JDK 25
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Build OJP Server Docker image
        run: |
          docker build -t ${{ needs.resolve-version.outputs.ojp_image }} ojp-server/
          echo "OJP_IMAGE=${{ needs.resolve-version.outputs.ojp_image }}" >> $GITHUB_ENV

      # Start first OJP server instance on port 10591
      - name: Start OJP Server 1 on port 10591
        run: |
          docker run -d --name ojp-server-1 \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.port=10591 -Dojp.prometheus.port=9159 -Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}
          echo "Started OJP Server 1 container on gRPC port 10591, Prometheus port 9159"

      # Start second OJP server instance on port 10592
      - name: Start OJP Server 2 on port 10592
        run: |
          docker run -d --name ojp-server-2 \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.port=10592 -Dojp.prometheus.port=9160 -Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}
          echo "Started OJP Server 2 container on gRPC port 10592, Prometheus port 9160"

      - name: Wait for OJP servers to start
        run: |
          echo "Waiting for OJP servers to open gRPC ports 10591 and 10592..."
          timeout 120 bash -c 'until nc -z localhost 10591; do sleep 1; done'
          echo "✓ Port 10591 is open"
          timeout 120 bash -c 'until nc -z localhost 10592; do sleep 1; done'
          echo "✓ Port 10592 is open"

      - name: Build (ojp-jdbc-driver) with JDK 25
        run: mvn clean install -pl ojp-jdbc-driver -am -DskipTests -Dgpg.skip=true

      - name: Create temp directory for test logs
        run: mkdir -p temp

      # Run the multinode integration test in background
      # This test will create connections to both servers and test failover scenarios
      - name: Start MultinodeIntegrationTest with nohup
        run: |
          echo "Starting MultinodeIntegrationTest in background..."
          nohup mvn test -pl ojp-jdbc-driver -Dtest=MultinodeIntegrationTest -DmultinodeTestsEnabled=true -Dgpg.skip=true > temp/MultinodeIntegrationTest.log 2>&1 &
          echo $! > temp/multinode-test.pid
          echo "MultinodeIntegrationTest started with PID $(cat temp/multinode-test.pid)"
          # Wait until the test's SQL phase completes and the keepalive phase begins,
          # indicated by the sentinel file /tmp/multinode-queries-done.
          # This avoids a fixed sleep that may be too short on a slow runner.
          echo "Waiting for MultinodeIntegrationTest to enter keepalive phase..."
          timeout 600 bash -c 'until [ -f /tmp/multinode-queries-done ]; do sleep 5; done'
          echo "✓ MultinodeIntegrationTest is in keepalive phase — connections are established"

      # Verify connection pooling is working correctly
      # Expected: 20-24 connections (10-12 per server)
      - name: Check PostgreSQL connections during test
        run: |
          echo "Checking PostgreSQL connections..."
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge 20 ] && [ "$CONNECTION_COUNT" -le 27 ]; then
              echo "✓ Connection count is within expected range: 20 ≤ $CONNECTION_COUNT ≤ 27"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt 27 ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds maximum of 27!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least 20... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never reached 20 (current: $CONNECTION_COUNT)"
            exit 1
          fi

      # Test failover: Kill server 1 and verify connections migrate to server 2
      - name: Kill OJP Server 1
        run: |
          echo "Killing OJP Server 1..."
          docker logs ojp-server-1 > /tmp/ojp-server-1.log 2>&1 || true
          docker stop ojp-server-1 || true
          docker rm ojp-server-1 || true
          echo "OJP Server 1 container stopped and removed"
          sleep 10

      # Verify failover: Connections should still be active on server 2
      - name: Check PostgreSQL connections after killing Server 1
        run: |
          echo "Checking PostgreSQL connections after killing Server 1..."
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge 20 ] && [ "$CONNECTION_COUNT" -le 27 ]; then
              echo "✓ Connection count is within expected range: 20 ≤ $CONNECTION_COUNT ≤ 27"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt 27 ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds maximum of 27!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least 20... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${ELAPSED}s - connection count never reached 20 (current: $CONNECTION_COUNT)"
            exit 1
          fi

      # Test recovery: Restart server 1 and verify it rejoins the cluster
      - name: Restart OJP Server 1
        run: |
          echo "Restarting OJP Server 1..."
          docker run -d --name ojp-server-1 \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.port=10591 -Dojp.prometheus.port=9159 -Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}
          echo "OJP Server 1 container restarted"
          sleep 10

      # Verify recovery: Connections should be distributed across both servers again
      - name: Check PostgreSQL connections after restarting Server 1
        run: |
          echo "Checking PostgreSQL connections after restarting Server 1..."
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge 20 ] && [ "$CONNECTION_COUNT" -le 27 ]; then
              echo "✓ Connection count is within expected range: 20 ≤ $CONNECTION_COUNT ≤ 27"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt 27 ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds maximum of 27!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least 20... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never reached 20 (current: $CONNECTION_COUNT)"
            exit 1
          fi

      # Test failover again: Kill server 2
      - name: Kill OJP Server 2
        run: |
          echo "Killing OJP Server 2..."
          docker logs ojp-server-2 > /tmp/ojp-server-2.log 2>&1 || true
          docker stop ojp-server-2 || true
          docker rm ojp-server-2 || true
          echo "OJP Server 2 container stopped and removed"
          sleep 10

      # Verify failover: Connections should migrate to server 1
      - name: Check PostgreSQL connections after killing Server 2
        run: |
          echo "Checking PostgreSQL connections after killing Server 2..."
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge 20 ] && [ "$CONNECTION_COUNT" -le 27 ]; then
              echo "✓ Connection count is within expected range: 20 ≤ $CONNECTION_COUNT ≤ 27"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt 27 ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds maximum of 27!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least 20... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never reached 20 (current: $CONNECTION_COUNT)"
            exit 1
          fi

      # Test recovery again: Restart server 2
      - name: Restart OJP Server 2
        run: |
          echo "Restarting OJP Server 2..."
          docker run -d --name ojp-server-2 \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.port=10592 -Dojp.prometheus.port=9160 -Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}
          echo "OJP Server 2 container restarted"
          sleep 10

      # Final verification: Both servers should be active
      - name: Check PostgreSQL connections after restarting Server 2
        run: |
          echo "Checking PostgreSQL connections after restarting Server 2..."
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge 20 ] && [ "$CONNECTION_COUNT" -le 27 ]; then
              echo "✓ Connection count is within expected range: 20 ≤ $CONNECTION_COUNT ≤ 27"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt 27 ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds maximum of 27!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least 20... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never reached 20 (current: $CONNECTION_COUNT)"
            exit 1
          fi

      # Signal the keepalive phase in MultinodeIntegrationTest to exit.
      # This runs even on failure so the background test process does not linger
      # for its full 12-minute cap after a CI step has already failed.
      - name: Signal MultinodeIntegrationTest keepalive to stop
        if: always()
        run: |
          echo "Creating /tmp/multinode-ci-done to stop the keepalive loop..."
          touch /tmp/multinode-ci-done
          echo "Signal sent"

      # Wait for the test process to complete
      - name: Wait for MultinodeIntegrationTest to complete
        run: |
          echo "Waiting for MultinodeIntegrationTest to complete..."
          # Wait for test process to finish (max 10 minutes)
          if [ -f temp/multinode-test.pid ]; then
            TEST_PID=$(cat temp/multinode-test.pid)
            TIMEOUT=600
            ELAPSED=0
            while kill -0 $TEST_PID 2>/dev/null && [ $ELAPSED -lt $TIMEOUT ]; do
              echo "Test still running... (${ELAPSED}s elapsed)"
              sleep 10
              ELAPSED=$((ELAPSED + 10))
            done
            
            if kill -0 $TEST_PID 2>/dev/null; then
              echo "Test did not complete within timeout, terminating..."
              kill $TEST_PID || true
            else
              echo "Test completed successfully"
            fi
          fi

      # Verify the test actually passed
      - name: Verify test results
        run: |
          echo "Checking MultinodeIntegrationTest results..."
          if grep -q "BUILD SUCCESS" temp/MultinodeIntegrationTest.log; then
            echo "✓ Test passed successfully"
          elif grep -q "BUILD FAILURE" temp/MultinodeIntegrationTest.log; then
            echo "✗ Test failed"
            exit 1
          else
            echo "✗ Could not determine test status — BUILD SUCCESS not found in log"
            cat temp/MultinodeIntegrationTest.log || true
            exit 1
          fi

      # Show logs for debugging (runs even if test fails)
      - name: Show OJP Server 1 log
        if: always()
        run: |
          echo "=== OJP Server 1 Initial Log ==="
          cat /tmp/ojp-server-1.log || echo "/tmp/ojp-server-1.log not found"
          echo ""
          echo "=== OJP Server 1 Restart Log ==="
          docker logs ojp-server-1 2>&1 || echo "ojp-server-1 container not found"

      - name: Show OJP Server 2 log
        if: always()
        run: |
          echo "=== OJP Server 2 Initial Log ==="
          cat /tmp/ojp-server-2.log || echo "/tmp/ojp-server-2.log not found"
          echo ""
          echo "=== OJP Server 2 Restart Log ==="
          docker logs ojp-server-2 2>&1 || echo "ojp-server-2 container not found"

      - name: Show MultinodeIntegrationTest log
        if: always()
        run: |
          echo "=== MultinodeIntegrationTest Log ==="
          cat temp/MultinodeIntegrationTest.log || echo "temp/MultinodeIntegrationTest.log not found"

      # Clean up resources
      - name: Cleanup
        if: always()
        run: |
          # Stop and remove any remaining OJP server containers
          docker stop ojp-server-1 ojp-server-2 2>/dev/null || true
          docker rm ojp-server-1 ojp-server-2 2>/dev/null || true
          # Stop Postgres container
          docker stop ojp-postgres-multinode || true
          docker rm ojp-postgres-multinode || true

  # ===========================================================================
  # JOB 8: Multinode XA Integration Tests
  # ===========================================================================
  #
  # This job tests multinode functionality with XA (eXtended Architecture) 
  # distributed transactions using TWO OJP server instances.
  # It verifies XA transaction support and failover scenarios by:
  # 1. Starting two OJP servers on different ports (10591, 10592)
  # 2. Running tests that use XA connections to both servers
  # 3. Killing servers one at a time and verifying XA failover
  # 4. Restarting servers and verifying XA recovery
  #
  # Database: PostgreSQL (with XA prepared transactions support)
  # Execution: Runs after all selected Main CI H2 jobs succeed.
  #
  # NOTE: Connection count checks expect 20-27 connections (XA pool only, non-XA pool disabled).
  #
  # ===========================================================================
  multinode-xa-test:
    name: Multinode XA Integration Test (Run ${{ matrix.run }})
    runs-on: ubuntu-latest
    # DEPENDENCY: This job waits until every selected Main CI H2 job succeeds.
    needs: [detect-changes, h2-integration-gate, resolve-version]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java == 'true' && needs.h2-integration-gate.result == 'success' && needs.resolve-version.result == 'success' }}
    strategy:
      max-parallel: 1
      matrix:
        run: [1, 2, 3, 4, 5]

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Start PostgreSQL container for multinode XA tests
      # Configured with max_prepared_transactions=100 for XA support
      - name: Start Postgres
        run: |
          docker run --name ojp-postgres-multinode-xa \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=defaultdb \
            -p 5432:5432 \
            -d postgres:17 \
            -c max_prepared_transactions=100
      
          # Wait for Postgres to become ready (up to 60s)
          timeout 60 bash -c 'until docker exec ojp-postgres-multinode-xa pg_isready -U testuser -d defaultdb -h 127.0.0.1; do sleep 2; done'

          # Verify setting
          PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SHOW max_prepared_transactions;"

      - name: Set up JDK 25 for build
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons) with JDK 25
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Test (ojp-grpc-commons) with JDK 25
        run: mvn test -pl ojp-grpc-commons -Dgpg.skip=true

      # Download open source JDBC drivers into ojp-server/ojp-libs for inclusion in the Docker image
      - name: Download Open Source Drivers
        run: bash ojp-server/download-drivers.sh ./ojp-server/ojp-libs

      - name: Build (ojp-server) with JDK 25
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Build OJP Server Docker image
        run: |
          docker build -t ${{ needs.resolve-version.outputs.ojp_image }} ojp-server/
          echo "OJP_IMAGE=${{ needs.resolve-version.outputs.ojp_image }}" >> $GITHUB_ENV

      # Start first OJP server instance on port 10591 with DEBUG logging
      - name: Start OJP Server 1 on port 10591
        run: |
          # Enable DEBUG logging for XA pool operations via JAVA_TOOL_OPTIONS
          docker run -d --name ojp-server-xa-1 \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.port=10591 -Dojp.prometheus.port=9161 -Dojp.server.slowQuerySegregation.enabled=true -Dorg.slf4j.simpleLogger.log.org.openjproxy.xa.pool=DEBUG" \
            ${{ env.OJP_IMAGE }}
          echo "Started OJP Server 1 container on gRPC port 10591, Prometheus port 9161 with DEBUG logging"

      # Start second OJP server instance on port 10592 with DEBUG logging
      - name: Start OJP Server 2 on port 10592
        run: |
          # Enable DEBUG logging for XA pool operations via JAVA_TOOL_OPTIONS
          docker run -d --name ojp-server-xa-2 \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.port=10592 -Dojp.prometheus.port=9162 -Dojp.server.slowQuerySegregation.enabled=true -Dorg.slf4j.simpleLogger.log.org.openjproxy.xa.pool=DEBUG" \
            ${{ env.OJP_IMAGE }}
          echo "Started OJP Server 2 container on gRPC port 10592, Prometheus port 9162 with DEBUG logging"

      - name: Wait for OJP servers to start
        run: |
          echo "Waiting for OJP servers to open gRPC ports 10591 and 10592..."
          timeout 120 bash -c 'until nc -z localhost 10591; do sleep 1; done'
          echo "✓ Port 10591 is open"
          timeout 120 bash -c 'until nc -z localhost 10592; do sleep 1; done'
          echo "✓ Port 10592 is open"

      - name: Build (ojp-jdbc-driver) with JDK 25
        run: mvn clean install -pl ojp-jdbc-driver -am -DskipTests -Dgpg.skip=true

      - name: Create temp directory for test logs
        run: mkdir -p temp

      # Run the multinode XA integration test in background with DEBUG logging for org.openjproxy packages only
      # This test will create XA connections to both servers and test failover scenarios
      # Note: Disabling non-XA pooling via system property to isolate XA connection behavior
      - name: Start MultinodeXAIntegrationTest with nohup
        run: |
          echo "Starting MultinodeXAIntegrationTest in background with DEBUG logging..."
          nohup mvn test -pl ojp-jdbc-driver -Dtest=MultinodeXAIntegrationTest -DmultinodeXATestsEnabled=true -Dgpg.skip=true -Dorg.slf4j.simpleLogger.log.org.openjproxy=DEBUG -Dorg.slf4j.simpleLogger.log.org.openjproxy.jdbc.ResultSet=INFO -Dmultinode.ojp.connection.pool.enabled=false > temp/MultinodeXAIntegrationTest.log 2>&1 &
          echo $! > temp/multinode-xa-test.pid
          echo "MultinodeXAIntegrationTest started with DEBUG logging, PID $(cat temp/multinode-xa-test.pid)"
          # Wait until the test's SQL phase completes and the keepalive phase begins,
          # indicated by the sentinel file /tmp/multinode-xa-queries-done.
          # This avoids a fixed sleep that may be too short on a slow runner.
          echo "Waiting for MultinodeXAIntegrationTest to enter keepalive phase..."
          timeout 600 bash -c 'until [ -f /tmp/multinode-xa-queries-done ]; do sleep 5; done'
          echo "✓ MultinodeXAIntegrationTest is in keepalive phase — connections are established"

      # Verify XA connection pooling is working
      # Expected range: 20-27 connections (XA pool only, non-XA pool disabled)
      # - XA pool max: 22 connections per server
      # - Plus 1-3 connections for SQL queries that count the connections themselves
      # - Lower bound of 20 accounts for partial pool initialization or connection release timing
      - name: Check PostgreSQL connections during XA test
        run: |
          echo "Checking PostgreSQL connections..."
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            # Check for 20-27 connections (XA pool only, non-XA pool disabled)
            if [ "$CONNECTION_COUNT" -ge 20 ] && [ "$CONNECTION_COUNT" -le 27 ]; then
              echo "✓ Connection count is within expected range: 20 ≤ $CONNECTION_COUNT ≤ 27"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt 27 ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds expected maximum of 27!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least 20... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never reached 20 (current: $CONNECTION_COUNT)"
            exit 1
          fi

      # Test XA failover: Kill server 1 and verify XA transactions can continue on server 2
      - name: Kill OJP Server 1
        run: |
          echo "Killing OJP Server 1..."
          docker logs ojp-server-xa-1 > /tmp/ojp-server-xa-1.log 2>&1 || true
          docker stop ojp-server-xa-1 || true
          docker rm ojp-server-xa-1 || true
          echo "OJP Server 1 container stopped and removed"
          sleep 5

      # Verify XA failover: Connections should still be active on server 2
      # Expected range: 20-27 connections (XA pool only, non-XA pool disabled)
      # - XA pool max: 22 connections per server
      # - Plus 1-3 connections for SQL queries that count the connections themselves
      # - Lower bound of 20 accounts for partial pool initialization or connection release timing
      # - During pool rebalancing, temporary spikes above 25 are allowed for up to 600 seconds (same as lower bound)
      - name: Check PostgreSQL connections after killing Server 1
        run: |
          echo "Checking PostgreSQL connections after killing Server 1..."
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge 20 ] && [ "$CONNECTION_COUNT" -le 27 ]; then
              echo "✓ Connection count is within expected range: 20 ≤ $CONNECTION_COUNT ≤ 27"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt 27 ]; then
              # Allow temporary spike during pool rebalancing - wait up to TIMEOUT (600s) same as lower bound
              echo "⚠ Connection count temporarily high ($CONNECTION_COUNT > 27), waiting for pool rebalancing..."
            else
              # Count is below minimum - wait for connections to grow
              echo "Waiting for connections to reach at least 20... (currently: $CONNECTION_COUNT)"
            fi
            
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never stabilized in range 20-27 (current: $CONNECTION_COUNT)"
            exit 1
          fi

      # Test XA recovery: Restart server 1 and verify it rejoins the cluster
      - name: Restart OJP Server 1
        run: |
          echo "Restarting OJP Server 1..."
          docker run -d --name ojp-server-xa-1 \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.port=10591 -Dojp.prometheus.port=9161 -Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}
          echo "OJP Server 1 container restarted"
          
          # Wait for server to fully start
          echo "Waiting for OJP Server 1 to reopen port 10591..."
          timeout 120 bash -c 'until nc -z localhost 10591; do sleep 1; done'
          echo "✓ Port 10591 is open"

      # Verify XA recovery: Connections should be distributed across both servers again
      # Expected range: 20-27 connections (XA pool only, non-XA pool disabled)
      # - XA pool max: 22 connections per server
      # - Plus 1-3 connections for SQL queries that count the connections themselves
      # - Lower bound of 20 accounts for partial pool initialization or connection release timing
      # - During pool rebalancing, temporary spikes above 25 are allowed for up to 15 seconds
      - name: Check PostgreSQL connections after restarting Server 1
        run: |
          echo "Checking PostgreSQL connections after restarting Server 1..."
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge 20 ] && [ "$CONNECTION_COUNT" -le 27 ]; then
              echo "✓ Connection count is within expected range: 20 ≤ $CONNECTION_COUNT ≤ 27"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt 27 ]; then
              # Allow temporary spike during pool rebalancing - wait up to TIMEOUT (600s) same as lower bound
              echo "⚠ Connection count temporarily high ($CONNECTION_COUNT > 27), waiting for pool rebalancing..."
            else
              # Count is below minimum - wait for connections to grow
              echo "Waiting for connections to reach at least 20... (currently: $CONNECTION_COUNT)"
            fi
            
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never stabilized in range 20-27 (current: $CONNECTION_COUNT)"
            exit 1
          fi

      # Test XA failover again: Kill server 2
      - name: Kill OJP Server 2
        run: |
          echo "Killing OJP Server 2..."
          docker logs ojp-server-xa-2 > /tmp/ojp-server-xa-2.log 2>&1 || true
          docker stop ojp-server-xa-2 || true
          docker rm ojp-server-xa-2 || true
          echo "OJP Server 2 container stopped and removed"
          sleep 5

      # Verify XA failover: Connections should migrate to server 1
      # Expected range: 20-27 connections (XA pool only, non-XA pool disabled)
      # - XA pool max: 22 connections per server
      # - Plus 1-3 connections for SQL queries that count the connections themselves
      # - Lower bound of 20 accounts for partial pool initialization or connection release timing
      # - During pool rebalancing, temporary spikes above 25 are allowed for up to 15 seconds
      - name: Check PostgreSQL connections after killing Server 2
        run: |
          echo "Checking PostgreSQL connections after killing Server 2..."
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge 20 ] && [ "$CONNECTION_COUNT" -le 27 ]; then
              echo "✓ Connection count is within expected range: 20 ≤ $CONNECTION_COUNT ≤ 27"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt 27 ]; then
              # Allow temporary spike during pool rebalancing - wait up to TIMEOUT (600s) same as lower bound
              echo "⚠ Connection count temporarily high ($CONNECTION_COUNT > 27), waiting for pool rebalancing..."
            else
              # Count is below minimum - wait for connections to grow
              echo "Waiting for connections to reach at least 20... (currently: $CONNECTION_COUNT)"
            fi
            
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never stabilized in range 20-27 (current: $CONNECTION_COUNT)"
            exit 1
          fi

      # Test XA recovery again: Restart server 2
      - name: Restart OJP Server 2
        run: |
          echo "Restarting OJP Server 2..."
          docker run -d --name ojp-server-xa-2 \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.port=10592 -Dojp.prometheus.port=9162 -Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}
          echo "OJP Server 2 container restarted"
          
          # Wait for server to fully start
          echo "Waiting for OJP Server 2 to reopen port 10592..."
          timeout 120 bash -c 'until nc -z localhost 10592; do sleep 1; done'
          echo "✓ Port 10592 is open"

      # Final XA verification: Both servers should be active
      # Expected range: 20-27 connections (XA pool only, non-XA pool disabled)
      # - XA pool max: 22 connections per server
      # - Plus 1-3 connections for SQL queries that count the connections themselves
      # - Lower bound of 20 accounts for partial pool initialization or connection release timing
      # - During pool rebalancing, temporary spikes above 25 are allowed for up to 15 seconds
      - name: Check PostgreSQL connections after restarting Server 2
        run: |
          echo "Checking PostgreSQL connections after restarting Server 2..."
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge 20 ] && [ "$CONNECTION_COUNT" -le 27 ]; then
              echo "✓ Connection count is within expected range: 20 ≤ $CONNECTION_COUNT ≤ 27"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt 27 ]; then
              # Allow temporary spike during pool rebalancing - wait up to TIMEOUT (600s) same as lower bound
              echo "⚠ Connection count temporarily high ($CONNECTION_COUNT > 27), waiting for pool rebalancing..."
            else
              # Count is below minimum - wait for connections to grow
              echo "Waiting for connections to reach at least 20... (currently: $CONNECTION_COUNT)"
            fi
            
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never stabilized in range 20-27 (current: $CONNECTION_COUNT)"
            exit 1
          fi

      # Signal the keepalive phase in MultinodeXAIntegrationTest to exit.
      # This runs even on failure so the background test process does not linger
      # for its full 12-minute cap after a CI step has already failed.
      - name: Signal MultinodeXAIntegrationTest keepalive to stop
        if: always()
        run: |
          echo "Creating /tmp/multinode-xa-ci-done to stop the keepalive loop..."
          touch /tmp/multinode-xa-ci-done
          echo "Signal sent"

      # Wait for the XA test process to complete
      - name: Wait for MultinodeXAIntegrationTest to complete
        run: |
          echo "Waiting for MultinodeXAIntegrationTest to complete..."
          # Wait for test process to finish (max 10 minutes)
          if [ -f temp/multinode-xa-test.pid ]; then
            TEST_PID=$(cat temp/multinode-xa-test.pid)
            TIMEOUT=600
            ELAPSED=0
            while kill -0 $TEST_PID 2>/dev/null && [ $ELAPSED -lt $TIMEOUT ]; do
              echo "Test still running... (${ELAPSED}s elapsed)"
              sleep 10
              ELAPSED=$((ELAPSED + 10))
            done
            
            if kill -0 $TEST_PID 2>/dev/null; then
              echo "Test did not complete within timeout, terminating..."
              kill $TEST_PID || true
            else
              echo "Test completed successfully"
            fi
          fi

      # Verify the XA test actually passed
      - name: Verify test results
        run: |
          echo "Checking MultinodeXAIntegrationTest results..."
          if grep -q "BUILD SUCCESS" temp/MultinodeXAIntegrationTest.log; then
            echo "✓ Test passed successfully"
          elif grep -q "BUILD FAILURE" temp/MultinodeXAIntegrationTest.log; then
            echo "✗ Test failed"
            exit 1
          else
            echo "✗ Could not determine test status — BUILD SUCCESS not found in log"
            cat temp/MultinodeXAIntegrationTest.log || true
            exit 1
          fi

      # Show logs for debugging (runs even if test fails)
      - name: Show OJP Server 1 log
        if: always()
        run: |
          echo "=== OJP Server 1 Initial Log ==="
          cat /tmp/ojp-server-xa-1.log || echo "/tmp/ojp-server-xa-1.log not found"
          echo ""
          echo "=== OJP Server 1 Restart Log ==="
          docker logs ojp-server-xa-1 2>&1 || echo "ojp-server-xa-1 container not found"

      - name: Show OJP Server 2 log
        if: always()
        run: |
          echo "=== OJP Server 2 Initial Log ==="
          cat /tmp/ojp-server-xa-2.log || echo "/tmp/ojp-server-xa-2.log not found"
          echo ""
          echo "=== OJP Server 2 Restart Log ==="
          docker logs ojp-server-xa-2 2>&1 || echo "ojp-server-xa-2 container not found"

      - name: Show MultinodeXAIntegrationTest log
        if: always()
        run: |
          echo "=== MultinodeXAIntegrationTest Log ==="
          cat temp/MultinodeXAIntegrationTest.log || echo "temp/MultinodeXAIntegrationTest.log not found"

      # Clean up resources
      - name: Cleanup
        if: always()
        run: |
          # Stop and remove any remaining OJP server containers
          docker stop ojp-server-xa-1 ojp-server-xa-2 2>/dev/null || true
          docker rm ojp-server-xa-1 ojp-server-xa-2 2>/dev/null || true
          # Stop Postgres container
          docker stop ojp-postgres-multinode-xa || true
          docker rm ojp-postgres-multinode-xa || true

  # ===========================================================================
  # JOB 9: Oracle Database Testing
  # ===========================================================================
  #
  # This job tests Oracle Database integration.
  # Oracle JDBC driver is dynamically added during CI (not in repository due
  # to licensing). The test uses Oracle XE container with full configuration.
  #
  # Database: Oracle XE 21c
  # Matrix strategy: Tests against Java 11, 17, 21, 25
  # Execution: Runs after all selected Main CI H2 jobs succeed.
  #
  # ===========================================================================
  oracle-test:
    name: Oracle Tests (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    # DEPENDENCY: This job waits until every selected Main CI H2 job succeeds.
    needs: [detect-changes, h2-integration-gate, resolve-version]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java == 'true' && needs.h2-integration-gate.result == 'success' && needs.resolve-version.result == 'success' }}
    
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        java-version: [ 11, 17, 21, 25 ]

    services:
      # Oracle XE database service container
      # Configured with testuser/testpassword for testing
      oracle:
        image: gvenzl/oracle-xe:21-full
        env:
          ORACLE_PASSWORD: testpassword
          APP_USER: testuser
          APP_USER_PASSWORD: testpassword
        options: >-
          --name ojp-oracle
          --health-cmd "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/testpassword@localhost/XEPDB1"
          --health-interval 20s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 1521:1521

    steps:

      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Grant XA (eXtended Architecture) permissions for distributed transactions
      # Oracle requires specific privileges for XA transaction support
      - name: Grant XA permissions to Oracle test user
        run: |
          # Wait a bit for Oracle to be fully ready
          sleep 5
          
          # Grant XA permissions to testuser
          echo "=== Granting XA permissions to testuser ==="
          
          docker exec ojp-oracle sqlplus -s system/testpassword@localhost/XEPDB1 <<'EOF'
          SET ECHO ON
          SET FEEDBACK ON
          SET SERVEROUTPUT ON
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          
          -- Grant XA_RECOVER_ADMIN role (Oracle 12c+) for XA transaction recovery
          -- This role includes necessary privileges for XA operations
          GRANT XA_RECOVER_ADMIN TO testuser;
          
          -- XA transaction permissions (additional grants for completeness)
          GRANT SELECT ON sys.dba_pending_transactions TO testuser;
          GRANT SELECT ON sys.pending_trans$ TO testuser;
          GRANT SELECT ON sys.dba_2pc_pending TO testuser;
          GRANT SELECT ON sys.dba_2pc_neighbors TO testuser;
          GRANT EXECUTE ON sys.dbms_xa TO testuser;
          GRANT EXECUTE ON sys.dbms_system TO testuser;
          GRANT FORCE ANY TRANSACTION TO testuser;
          
          -- Verify grants
          SELECT 'XA permissions granted successfully' AS status FROM dual;
          
          -- Show granted privileges and roles
          SELECT granted_role, grantee FROM dba_role_privs WHERE grantee = 'TESTUSER' ORDER BY granted_role;
          SELECT privilege, grantee FROM dba_sys_privs WHERE grantee = 'TESTUSER' ORDER BY privilege;
          SELECT owner, table_name, privilege, grantee FROM dba_tab_privs WHERE grantee = 'TESTUSER' ORDER BY owner, table_name;
          
          EXIT;
          EOF
          
          if [ $? -ne 0 ]; then
            echo "ERROR: Failed to grant XA permissions!"
            exit 1
          fi
          
          echo "=== XA permissions granted successfully ==="

      # Download Oracle JDBC driver and place in ojp-server/ojp-libs directory for inclusion in the Docker image
      # We don't include it in the repository due to Oracle licensing
      # The driver will be loaded at runtime via the ojp-libs directory copied into the Docker image
      - name: Download Oracle JDBC Driver to ojp-server/ojp-libs
        run: |
          # Create ojp-server/ojp-libs directory for inclusion in the Docker image
          mkdir -p ojp-server/ojp-libs
          
          # Download Oracle JDBC driver from Maven Central
          echo "=== Downloading Oracle JDBC driver ==="
          mvn dependency:copy \
            -Dartifact=com.oracle.database.jdbc:ojdbc11:23.8.0.25.04 \
            -DoutputDirectory=ojp-server/ojp-libs \
            -Dmdep.stripVersion=false
          
          # Verify the download
          echo "=== Oracle JDBC driver downloaded to ojp-server/ojp-libs ==="
          ls -lh ojp-server/ojp-libs/

      - name: Set up JDK 25 for build
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons) with JDK 25
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Test (ojp-grpc-commons) with JDK 25
        run: mvn test -pl ojp-grpc-commons -Dgpg.skip=true

      # Download open source JDBC drivers into ojp-server/ojp-libs for inclusion in the Docker image
      - name: Download Open Source Drivers
        run: bash ojp-server/download-drivers.sh ./ojp-server/ojp-libs

      - name: Build (ojp-server) with JDK 25
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Build OJP Server Docker image
        run: |
          docker build -t ${{ needs.resolve-version.outputs.ojp_image }} ojp-server/
          echo "OJP_IMAGE=${{ needs.resolve-version.outputs.ojp_image }}" >> $GITHUB_ENV

      - name: Start OJP Server container with Oracle driver from ojp-server/ojp-libs
        run: |
          docker run -d --name ojp-server \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}

      - name: Wait for ojp-server to start
        run: sleep 10

      - name: Set up JDK ${{ matrix.java-version }} for ojp-jdbc-driver
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build (ojp-jdbc-driver) with JDK ${{ matrix.java-version }}
        run: mvn clean install -pl ojp-jdbc-driver -am -DskipTests -Dgpg.skip=true

      # Run Oracle-specific tests with -DenableOracleTests flag
      - name: Test (ojp-jdbc-driver) with Oracle enabled
        run: mvn test -pl ojp-jdbc-driver -Dgpg.skip=true -DenableOracleTests=true

      - name: Show ojp-server.log
        if: always()  # ensures it runs even if previous steps fail
        run: docker logs ojp-server 2>&1 || echo "ojp-server container not found"

  # ===========================================================================
  # JOB 10: SQL Server Integration Tests
  # ===========================================================================
  #
  # This job tests SQL Server integration using TestContainers.
  # TestContainers automatically manages the SQL Server container lifecycle,
  # so no manual container setup is needed.
  #
  # Database: SQL Server (via TestContainers)
  # Matrix strategy: Tests against Java 11, 17, 21, 25
  # Execution: Runs after all selected Main CI H2 jobs succeed.
  #
  # ===========================================================================
  sqlserver-tests:
    name: SQL Server Integration Tests (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    # DEPENDENCY: This job waits until every selected Main CI H2 job succeeds.
    needs: [detect-changes, h2-integration-gate, resolve-version]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java == 'true' && needs.h2-integration-gate.result == 'success' && needs.resolve-version.result == 'success' }}
    
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        java-version: [ 11, 17, 21, 25 ]

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Download SQL Server JDBC driver and place in ojp-server/ojp-libs directory for inclusion in the Docker image
      # Similar to Oracle and DB2, we handle it via the ojp-libs directory copied into the Docker image
      - name: Download SQL Server JDBC Driver to ojp-server/ojp-libs
        run: |
          # Create ojp-server/ojp-libs directory for inclusion in the Docker image
          mkdir -p ojp-server/ojp-libs
          
          # Download SQL Server JDBC driver from Maven Central
          echo "=== Downloading SQL Server JDBC driver ==="
          mvn dependency:copy \
            -Dartifact=com.microsoft.sqlserver:mssql-jdbc:12.8.2.jre11 \
            -DoutputDirectory=ojp-server/ojp-libs \
            -Dmdep.stripVersion=false
          
          # Verify the download
          echo "=== SQL Server JDBC driver downloaded to ojp-server/ojp-libs ==="
          ls -lh ojp-server/ojp-libs/

      - name: Set up JDK 25 for build
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons) with JDK 25
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Test (ojp-grpc-commons) with JDK 25
        run: mvn test -pl ojp-grpc-commons -Dgpg.skip=true

      # Download open source JDBC drivers into ojp-server/ojp-libs for inclusion in the Docker image
      - name: Download Open Source Drivers
        run: bash ojp-server/download-drivers.sh ./ojp-server/ojp-libs

      - name: Build (ojp-server) with JDK 25
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Build OJP Server Docker image
        run: |
          docker build -t ${{ needs.resolve-version.outputs.ojp_image }} ojp-server/
          echo "OJP_IMAGE=${{ needs.resolve-version.outputs.ojp_image }}" >> $GITHUB_ENV

      - name: Start OJP Server container with SQL Server driver from ojp-server/ojp-libs
        run: |
          docker run -d --name ojp-server \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}

      - name: Wait for ojp-server to start
        run: sleep 10

      - name: Set up JDK ${{ matrix.java-version }} for ojp-jdbc-driver
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build (ojp-jdbc-driver) with JDK ${{ matrix.java-version }}
        run: mvn clean install -pl ojp-jdbc-driver -am -DskipTests -Dgpg.skip=true

      # Run SQL Server-specific tests
      # Uses -DenableSqlServerTests=true flag and filters to SQLServer* test classes
      # TestContainers will automatically start a SQL Server container for these tests
      - name: Run SQL Server Integration Tests
        run: |
          mvn test -pl ojp-jdbc-driver -Dgpg.skip=true \
            -DenableSqlServerTests=true \
            -Dtest="SQLServer*"

      - name: Show ojp-server.log
        if: always()  # ensures it runs even if previous steps fail
        run: docker logs ojp-server 2>&1 || echo "ojp-server container not found"

  # ===========================================================================
  # JOB 11: C++ ODBC H2 L1-L5 Integration Tests
  # ===========================================================================
  #
  # This H2-only job runs in parallel with the main H2 build-test job.
  #
  # ===========================================================================
  cpp-odbc-test:
    name: C++ ODBC H2 L1-L5 Tests
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.cpp == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons)
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Download open source JDBC drivers
        run: bash ojp-server/download-drivers.sh ./ojp-libs

      - name: Build (ojp-server)
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Install C++ gRPC and ODBC build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            golang-github-gogo-googleapis-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc \
            unixodbc-dev

      - name: Start OJP server (background)
        run: |
          jar=$(ls ojp-server/target/ojp-server-*-shaded.jar | head -1)
          java -Duser.timezone=UTC -Dojp.libs.path=./ojp-libs \
            -jar "$jar" > /tmp/ojp-server.log 2>&1 &
          echo "OJP server PID=$!"

      - name: Wait for OJP server to start
        run: |
          for i in $(seq 1 30); do
            if grep -q "OJP gRPC Server started" /tmp/ojp-server.log 2>/dev/null; then
              echo "OJP server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for OJP server. Log:"; cat /tmp/ojp-server.log
          exit 1

      - name: Configure C++ ODBC client
        run: |
          cmake -S ojp-client-cpp-odbc -B ojp-client-cpp-odbc/build \
            -DGOOGLEAPIS_PROTO_DIR=/usr/share/gocode/src/github.com/gogo/googleapis \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ ODBC client and tests
        run: cmake --build ojp-client-cpp-odbc/build --parallel 2

      - name: Run C++ ODBC H2 L1-L5 tests
        env:
          OJP_TEST_H2: 'true'
          OJP_TEST_H2_ADDR: 'localhost:1059'
        run: |
          ctest --test-dir ojp-client-cpp-odbc/build \
            -R '^OjpOdbcH2L[1-5]Integration$' --output-on-failure \
            2>&1 | tee /tmp/cpp-odbc-h2-l1-l5-test.log

      - name: Show ojp-server.log
        if: always()
        run: cat /tmp/ojp-server.log

      - name: Save C++ ODBC H2 L1-L5 test report and server log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cpp-odbc-h2-l1-l5-test-results
          path: |
            /tmp/cpp-odbc-h2-l1-l5-test.log
            /tmp/ojp-server.log
          retention-days: 7

  # ===========================================================================
  # JOB 2: H2 Integration Gate
  # ===========================================================================
  #
  # Selected independent H2 jobs run in parallel. This aggregate gate releases
  # database-specific jobs only after the selected Main CI H2 phase succeeds.
  #
  # ===========================================================================
  h2-integration-gate:
    name: Selected H2 Integration Tests Passed
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test, dotnet-crud-test, ruby-dbi-test, python-h2-l1, cpp-odbc-test]
    if: ${{ !cancelled() }}
    steps:
      - name: Check selected H2 integration results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          SELECTED: ${{ toJSON(needs.detect-changes.outputs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.JOB_RESULTS);
          const selected = JSON.parse(process.env.SELECTED);
          let failed = needs['detect-changes'].result !== 'success';
          const suites = {
            'build-test': 'java',
            'dotnet-crud-test': 'dotnet',
            'ruby-dbi-test': 'ruby',
            'python-h2-l1': 'python',
            'cpp-odbc-test': 'cpp'
          };
          for (const [job, flag] of Object.entries(suites)) {
            const result = needs[job].result;
            const enabled = selected[flag];
            const valid = enabled === 'true' ? result === 'success' :
              enabled === 'false' && ['skipped', 'success'].includes(result);
            console.log(`${job}: selected=${enabled}, result=${result}`);
            failed ||= !valid;
          }
          if (failed) {
            console.error('Change detection or selected H2 integration tests did not pass.');
            process.exit(1);
          }
          NODE

  # ===========================================================================
  # JOB 13: C++ ODBC PostgreSQL L1 Integration Test
  # ===========================================================================
  #
  # Runs alongside the remaining database-specific integration tests, only
  # after the aggregate H2 gate has succeeded.
  #
  # ===========================================================================
  cpp-odbc-postgres-test:
    name: C++ ODBC PostgreSQL L1 Test
    runs-on: ubuntu-latest
    needs: [detect-changes, h2-integration-gate]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.cpp == 'true' && needs.h2-integration-gate.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons)
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Download open source JDBC drivers
        run: bash ojp-server/download-drivers.sh ./ojp-libs

      - name: Build (ojp-server)
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Install C++ gRPC and ODBC build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            golang-github-gogo-googleapis-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc \
            unixodbc-dev

      - name: Start OJP server (background)
        run: |
          jar=$(ls ojp-server/target/ojp-server-*-shaded.jar | head -1)
          java -Duser.timezone=UTC -Dojp.libs.path=./ojp-libs \
            -jar "$jar" > /tmp/ojp-server.log 2>&1 &
          echo "OJP server PID=$!"

      - name: Wait for OJP server to start
        run: |
          for i in $(seq 1 30); do
            if grep -q "OJP gRPC Server started" /tmp/ojp-server.log 2>/dev/null; then
              echo "OJP server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for OJP server. Log:"; cat /tmp/ojp-server.log
          exit 1

      - name: Configure C++ ODBC client
        run: |
          cmake -S ojp-client-cpp-odbc -B ojp-client-cpp-odbc/build \
            -DGOOGLEAPIS_PROTO_DIR=/usr/share/gocode/src/github.com/gogo/googleapis \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ ODBC client and tests
        run: cmake --build ojp-client-cpp-odbc/build --parallel 2

      - name: Run C++ ODBC PostgreSQL L1 tests
        env:
          OJP_TEST_POSTGRESQL: 'true'
          OJP_TEST_POSTGRESQL_ADDR: 'localhost:1059'
        run: |
          docker run --detach --rm --name ojp-odbc-postgres \
            --publish 5432:5432 \
            --env POSTGRES_USER=testuser \
            --env POSTGRES_PASSWORD=testpassword \
            --env POSTGRES_DB=defaultdb \
            postgres:17
          for i in $(seq 1 30); do
            if docker exec ojp-odbc-postgres pg_isready -U testuser -d defaultdb; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs ojp-odbc-postgres
              exit 1
            fi
            sleep 2
          done
          ctest --test-dir ojp-client-cpp-odbc/build \
            -R '^OjpOdbcPostgreSqlL1Integration$' --output-on-failure \
            2>&1 | tee /tmp/cpp-odbc-postgresql-l1-test.log

      - name: Show OJP server log
        if: always()
        run: cat /tmp/ojp-server.log

      - name: Show PostgreSQL logs
        if: always()
        run: |
          docker logs ojp-odbc-postgres 2>&1 || true
          docker stop ojp-odbc-postgres || true

      - name: Save C++ ODBC PostgreSQL test report and server log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cpp-odbc-postgresql-l1-test-results
          path: |
            /tmp/cpp-odbc-postgresql-l1-test.log
            /tmp/ojp-server.log
          retention-days: 7

  # ===========================================================================
  # JOB 14: C++ ODBC SQL Server L1-L4 Integration Tests
  # ===========================================================================
  #
  # Runs alongside the C++ ODBC PostgreSQL test after the aggregate H2 gate.
  #
  # ===========================================================================
  cpp-odbc-sqlserver-test:
    name: C++ ODBC SQL Server L1-L4 Tests
    runs-on: ubuntu-latest
    needs: [h2-integration-gate]
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons)
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Download SQL Server JDBC driver
        run: |
          mkdir -p ojp-libs
          mvn dependency:copy \
            -Dartifact=com.microsoft.sqlserver:mssql-jdbc:12.8.2.jre11 \
            -DoutputDirectory=ojp-libs \
            -Dmdep.stripVersion=false

      - name: Download open source JDBC drivers
        run: bash ojp-server/download-drivers.sh ./ojp-libs

      - name: Build (ojp-server)
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Install C++ gRPC and ODBC build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            golang-github-gogo-googleapis-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc \
            unixodbc-dev

      - name: Start SQL Server database
        run: |
          docker run --detach --rm --name ojp-odbc-sqlserver \
            --publish 1433:1433 \
            --env ACCEPT_EULA=Y \
            --env MSSQL_SA_PASSWORD='TestPassword123!' \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec ojp-odbc-sqlserver \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
              -P 'TestPassword123!' -C -b -Q 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker logs ojp-odbc-sqlserver
              exit 1
            fi
            sleep 2
          done
          docker exec ojp-odbc-sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P 'TestPassword123!' -C -b -Q \
            "IF DB_ID('defaultdb') IS NULL CREATE DATABASE defaultdb;"
          docker exec ojp-odbc-sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P 'TestPassword123!' -C -b -Q \
            "IF NOT EXISTS (SELECT * FROM sys.sql_logins WHERE name = 'testuser') CREATE LOGIN testuser WITH PASSWORD = 'TestPassword123!';"
          docker exec ojp-odbc-sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P 'TestPassword123!' -C -b -d defaultdb -Q \
            "IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = 'testuser') BEGIN CREATE USER testuser FOR LOGIN testuser; ALTER ROLE db_owner ADD MEMBER testuser; END"

      - name: Start OJP server (background)
        run: |
          jar=$(ls ojp-server/target/ojp-server-*-shaded.jar | head -1)
          java -Duser.timezone=UTC -Dojp.libs.path=./ojp-libs \
            -jar "$jar" > /tmp/ojp-server.log 2>&1 &
          echo "OJP server PID=$!"

      - name: Wait for OJP server to start
        run: |
          for i in $(seq 1 30); do
            if grep -q "OJP gRPC Server started" /tmp/ojp-server.log 2>/dev/null; then
              echo "OJP server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for OJP server. Log:"; cat /tmp/ojp-server.log
          exit 1

      - name: Configure C++ ODBC client
        run: |
          cmake -S ojp-client-cpp-odbc -B ojp-client-cpp-odbc/build \
            -DGOOGLEAPIS_PROTO_DIR=/usr/share/gocode/src/github.com/gogo/googleapis \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ ODBC client and tests
        run: cmake --build ojp-client-cpp-odbc/build --parallel 2

      - name: Run C++ ODBC SQL Server L1 through L4 tests
        env:
          OJP_TEST_SQLSERVER: 'true'
          OJP_TEST_SQLSERVER_ADDR: 'localhost:1059'
        run: |
          set -o pipefail
          ctest --test-dir ojp-client-cpp-odbc/build \
            -R '^OjpOdbcSqlServerL[1234]Integration$' --output-on-failure \
            2>&1 | tee /tmp/cpp-odbc-sqlserver-l1-l2-l3-l4-test.log

      - name: Show OJP server log
        if: always()
        run: cat /tmp/ojp-server.log

      - name: Show SQL Server logs
        if: always()
        run: |
          docker logs ojp-odbc-sqlserver 2>&1 || true
          docker stop ojp-odbc-sqlserver || true

      - name: Save C++ ODBC SQL Server test report and server log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cpp-odbc-sqlserver-l1-l2-l3-l4-test-results
          path: |
            /tmp/cpp-odbc-sqlserver-l1-l2-l3-l4-test.log
            /tmp/ojp-server.log
          retention-days: 7

  # ===========================================================================
  # JOB 15: Notify Integration Repository
  # ===========================================================================
  #
  # This job triggers a workflow in the ojp-framework-integration repository
  # to run integration tests with the latest OJP changes.
  #
  # Note: This job waits for every selected Main CI H2 job to pass before notifying
  # the integration repo, only for trusted push and manual events.
  #
  # ===========================================================================
  notify-integration:
    needs: [detect-changes, h2-integration-gate]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.framework == 'true' && needs.h2-integration-gate.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OJP Framework Integration Repo Workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INTEGRATION_REPO_PAT }}
          repository: Open-J-Proxy/ojp-framework-integration
          event-type: ojp-updated

  main-ci-result:
    name: Main CI Result
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - detect-changes
      - java-verify
      - resolve-version
      - build-test
      - dotnet-crud-test
      - ruby-dbi-test
      - python-h2-l1
      - cpp-odbc-test
      - h2-integration-gate
      - postgres-test
      - mysql-test
      - mariadb-test
      - cockroachdb-test
      - db2-test
      - multinode-test
      - multinode-xa-test
      - oracle-test
      - sqlserver-tests
      - cpp-odbc-postgres-test
      - notify-integration
    steps:
      - name: Check all selected suite results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          SELECTED: ${{ toJSON(needs.detect-changes.outputs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.JOB_RESULTS);
          const selected = JSON.parse(process.env.SELECTED);
          let failed = false;
          const suites = {
            'java-verify': 'java_build',
            'resolve-version': 'java',
            'build-test': 'java',
            'dotnet-crud-test': 'dotnet',
            'ruby-dbi-test': 'ruby',
            'python-h2-l1': 'python',
            'cpp-odbc-test': 'cpp',
            'postgres-test': 'java',
            'mysql-test': 'java',
            'mariadb-test': 'java',
            'cockroachdb-test': 'java',
            'db2-test': 'java',
            'multinode-test': 'java',
            'multinode-xa-test': 'java',
            'oracle-test': 'java',
            'sqlserver-tests': 'java',
            'cpp-odbc-postgres-test': 'cpp',
            'notify-integration': 'framework'
          };
          for (const [job, details] of Object.entries(needs)) {
            let expected = 'true';
            if (job in suites) {
              expected = selected[suites[job]];
            }
            if (job === 'notify-integration' &&
                !['push', 'workflow_dispatch'].includes(process.env.EVENT_NAME)) {
              expected = 'false';
            }
            const valid = expected === 'true' ? details.result === 'success' :
              expected === 'false' && ['skipped', 'success'].includes(details.result);
            console.log(`${job}: selected=${expected}, result=${details.result}`);
            failed ||= !valid;
          }
          if (failed) {
            console.error('Main CI failed: change detection or a selected suite did not pass.');
            process.exit(1);
          }
          NODE
