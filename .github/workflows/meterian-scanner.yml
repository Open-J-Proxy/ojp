name: Meterian Scanner

on:
  push:
    branches-ignore:
      - '**meterian-bot/pr**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  branches:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.b.outputs.list }}
    steps:
      - id: b
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "list=$(jq -nc --arg b "$REF_NAME" '[$b]')" >> "$GITHUB_OUTPUT"
          else
            lts=$(git ls-remote --heads "https://github.com/${{ github.repository }}" 'refs/heads/lts/*' | sed 's#.*refs/heads/##' | jq -R . | jq -sc .)
            echo "list=$(jq -nc --argjson l "$lts" '["main"] + $l')" >> "$GITHUB_OUTPUT"
          fi

  meterian_scan:
    needs: branches
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.branches.outputs.list) }}
    name: Meterian scan (${{ matrix.branch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}

      - name: Meterian Scanner
        uses: MeterianHQ/meterian-github-action@v1.0.17
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          oss: true
          autofix_security: safe
          autofix_with_pr: true
