# =============================================================================
# Main CI Workflow with Change-Selected, Fail-Fast Integration Tests
# =============================================================================
#
# This workflow runs selected H2 integration coverage first. Database-specific integration
# jobs start only after the H2 gate succeeds.
#
# WORKFLOW STRUCTURE:
# 0. detect-changes: Shared suite and Java reactor selection
# 0a. java-verify: Java 25 verification of selected modules
# 1. build-test: Fast H2-only tests (embedded database, no external services)
# 1a. dotnet-crud-test: .NET ADO.NET H2 L1 tests (independent)
# 1b. ruby-dbi-test: Ruby DBI client unit and H2 integration tests
# 1c. python-h2-l1: Python DB-API unit and H2 integration tests
# 2. h2-integration-gate: Waits for every selected Main CI H2 job to pass
# 3. postgres-test: PostgreSQL database tests (needs: h2-integration-gate, resolve-version)
# 4. mysql-test: MySQL database tests (needs: h2-integration-gate, resolve-version)
# 5. mariadb-test: MariaDB database tests (needs: h2-integration-gate, resolve-version)
# 6. cockroachdb-test: CockroachDB database tests (needs: h2-integration-gate, resolve-version)
# 7. db2-test: IBM DB2 database tests (needs: h2-integration-gate, resolve-version)
# 8. multinode-test: Multinode failover/recovery tests (needs: h2-integration-gate, resolve-version)
# 9. multinode-xa-test: Multinode XA integration tests (needs: h2-integration-gate, resolve-version)
# 10. oracle-test: Oracle database tests (needs: h2-integration-gate, resolve-version)
# 11. sqlserver-tests: SQL Server tests (needs: h2-integration-gate, resolve-version)
# 12. cpp-odbc-test: C++ ODBC H2 L1-L5 tests (runs alongside build-test)
# 13. cpp-odbc-postgres-test: C++ ODBC PostgreSQL L1 test (needs: h2-integration-gate)
# 14. cpp-odbc-sqlserver-test: C++ ODBC SQL Server L1/L2 tests (needs: h2-integration-gate)
# 15. notify-integration: Triggers integration repo workflow (needs: h2-integration-gate)
#
# SEQUENTIAL EXECUTION:
# Java and C++ ODBC database-specific jobs wait for the H2 integration gate.
# The Java H2 matrix, .NET, Ruby, Python, and C++ ODBC H2 jobs run in parallel.
# This ensures database-specific tests start only after every selected H2 job passes,
# providing:
# - Fast feedback (H2 tests complete in seconds)
# - Resource efficiency (avoids running expensive tests when basics fail)
# - Cost savings (reduces CI minutes when tests would fail anyway)
#
# Python tests build their own server and run alongside the Java H2 gate.
# Dart client coverage is owned by the standalone Dart workflow.
# Main CI Result checks selected suites and permits intentionally skipped jobs.
#
# This sequential execution works on ALL branches (PRs, main, feature branches)
# because all jobs are defined in a single workflow file.
#
# =============================================================================

name: Main CI

on:
  push:
    branches: [ main, 'lts/**' ]
  pull_request:
    branches: [ main, 'lts/**' ]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run all test suites
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ./.github/workflows/ci-test-selection.yml
    with:
      full-suite: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}

  java-verify:
    name: Verify selected Java modules (JDK 25)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java_build == 'true' }}
    env:
      JAVA_MODULES: ${{ needs.detect-changes.outputs.java_modules }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Install selected reactor and dependencies
        run: |
          test -n "$JAVA_MODULES"
          mvn clean install -pl "$JAVA_MODULES" -am -DskipTests -Dgpg.skip=true

      - name: Verify selected modules only
        run: mvn verify -pl "$JAVA_MODULES" -Dgpg.skip=true

  # ===========================================================================
  # JOB 0: Resolve OJP image tag
  # ===========================================================================
  #
  # Computes the Docker image tag once from the Maven project version and
  # exposes it as a job output so every downstream job can reference it
  # without re-running `mvn help:evaluate`.
  #
  # ===========================================================================
  resolve-version:
    name: Resolve OJP image tag
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java == 'true' }}
    outputs:
      ojp_image: ${{ steps.version.outputs.ojp_image }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Resolve version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -pl ojp-server)
          echo "ojp_image=rrobetti/ojp:${VERSION}" >> $GITHUB_OUTPUT

  # ===========================================================================
  # JOB 1: Build & Test with H2 (Fast Fail-Fast Gate)
  # ===========================================================================
  #
  # When selected, this job follows Java verification and tests against H2 embedded database.
  # H2 requires no external services and runs in seconds, making it ideal
  # for catching basic issues before running expensive database-specific tests.
  #
  # Test execution: Runs with -DenableH2Tests=true flag
  # Matrix strategy: Tests against Java 11, 17, 21, 25
  #
  # ===========================================================================
  build-test:
    name: Build & Test (H2 - Fast Fail-Fast)
    runs-on: ubuntu-latest
    needs: [detect-changes, java-verify, resolve-version]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java == 'true' && needs.java-verify.result == 'success' && needs.resolve-version.result == 'success' }}

    strategy:
      fail-fast: false
      matrix:
        java-version: [ 11, 17, 21, 25 ]

    steps:

      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25 for build
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons) with JDK 25
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      # Download open source JDBC drivers into ojp-server/ojp-libs for inclusion in the Docker image
      - name: Download Open Source Drivers
        run: bash ojp-server/download-drivers.sh ./ojp-server/ojp-libs

      - name: Build (ojp-server) with JDK 25
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Build OJP Server Docker image
        run: |
          docker build -t ${{ needs.resolve-version.outputs.ojp_image }} ojp-server/
          echo "OJP_IMAGE=${{ needs.resolve-version.outputs.ojp_image }}" >> $GITHUB_ENV

      - name: Start OJP Server container
        run: |
          docker run -d --name ojp-server \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}

      - name: Wait for ojp-server to start
        run: sleep 10

      - name: Set up JDK ${{ matrix.java-version }} for ojp-jdbc-driver
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build (ojp-jdbc-driver) with JDK ${{ matrix.java-version }}
        run: mvn clean install -pl ojp-jdbc-driver -am -DskipTests -Dgpg.skip=true

      # This is the key test step - only H2 tests are enabled
      # All other database tests are disabled by default
      - name: Test (ojp-jdbc-driver) with H2 only
        run: mvn test -pl ojp-jdbc-driver -Dgpg.skip=true -DenableH2Tests=true

      - name: Show ojp-server.log
        if: always()  # ensures it runs even if previous steps fail
        run: docker logs ojp-server 2>&1 || echo "ojp-server container not found"

  # ===========================================================================
  # .NET ADO.NET H2 L1 Integration Tests
  # ===========================================================================
  dotnet-crud-test:
    name: .NET ADO.NET L1 Test against H2
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.dotnet == 'true' }}
    permissions:
      contents: read

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons)
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Download open source JDBC drivers
        run: bash ojp-server/download-drivers.sh ./ojp-libs

      - name: Build OJP server
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Start OJP server
        run: |
          jar=$(ls ojp-server/target/ojp-server-*-shaded.jar | head -1)
          java -Duser.timezone=UTC -Dojp.libs.path=./ojp-libs \
            -jar "$jar" &>/tmp/ojp-server-dotnet.log &
          echo "OJP server PID=$!"

      - name: Wait for OJP server
        run: |
          for i in $(seq 1 30); do
            if grep -q "OJP gRPC Server started" /tmp/ojp-server-dotnet.log 2>/dev/null; then
              echo "OJP server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for OJP server. Log:"
          cat /tmp/ojp-server-dotnet.log
          exit 1

      - name: Run all .NET tests with H2 L1 integration enabled
        env:
          OJP_TEST_H2: 'true'
          OJP_TEST_H2_ADDR: 'localhost:1059'
        run: dotnet test ojp-client-dotnet-ado-net/Ojp.Client.DotNet.sln --logger "trx;LogFileName=dotnet-h2-l1.trx" --results-directory ojp-client-dotnet-ado-net/TestResults

      - name: Show OJP server log
        if: always()
        run: cat /tmp/ojp-server-dotnet.log

      - name: Save .NET H2 L1 test report and server log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dotnet-h2-l1-test-results
          path: |
            ojp-client-dotnet-ado-net/TestResults/
            /tmp/ojp-server-dotnet.log
          retention-days: 7

  # ===========================================================================
  # Ruby DBI Client Tests (H2)
  # ===========================================================================
  #
  # Run independently of the Java H2 gate so Java failures cannot skip Ruby
  # coverage. The live H2 integration test uses the checked-in CSV fixture.
  #
  # ===========================================================================
  ruby-dbi-test:
    name: Ruby DBI Client Tests (H2)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.ruby == 'true' }}
    permissions:
      contents: read

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Download open source JDBC drivers
        run: bash ojp-server/download-drivers.sh ./ojp-libs

      - name: Build OJP server
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true
          working-directory: ojp-client-ruby-dbi

      - name: Verify generated Ruby protocol bindings
        run: ./generate-proto.sh --check
        working-directory: ojp-client-ruby-dbi

      - name: Start OJP server
        run: |
          jar=$(ls ojp-server/target/ojp-server-*-shaded.jar | head -1)
          java -Duser.timezone=UTC -Dojp.libs.path=./ojp-libs \
            -jar "$jar" &>/tmp/ojp-server.log &
          echo "OJP server PID=$!"

      - name: Wait for OJP server
        run: |
          for i in $(seq 1 30); do
            if grep -q "OJP gRPC Server started" /tmp/ojp-server.log 2>/dev/null; then
              echo "OJP server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for OJP server. Log:"
          cat /tmp/ojp-server.log
          exit 1

      - name: Run all Ruby DBI unit and H2 integration tests
        env:
          OJP_TEST_H2: 'true'
          OJP_TEST_H2_ADDR: 'localhost:1059'
        run: |
          set -o pipefail
          bundle exec ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |file| require_relative file }' \
            | tee /tmp/ruby-h2-l1-test.log
        working-directory: ojp-client-ruby-dbi

      - name: Show OJP server log
        if: always()
        run: cat /tmp/ojp-server.log

      - name: Save Ruby H2 test report and server log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ruby-h2-l1-test-results
          path: |
            /tmp/ruby-h2-l1-test.log
            /tmp/ojp-server.log
          retention-days: 7

  # ===========================================================================
  # Python DB-API 2.0: all unit and real-server H2 integration tests
  # ===========================================================================
  python-h2-l1:
    name: Python DB-API Tests against H2
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.python == 'true' }}
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Git checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build OJP server
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Download JDBC drivers
        run: bash ojp-server/download-drivers.sh ./ojp-libs

      - name: Install Python client
        working-directory: ojp-client-python-dbapi
        run: python -m pip install -e '.[dev]'

      - name: Check Python protobuf generation
        working-directory: ojp-client-python-dbapi
        run: ojp-generate-proto --check

      - name: Start OJP server
        run: |
          jar=$(find ojp-server/target -maxdepth 1 -name 'ojp-server-*-shaded.jar' -print -quit)
          test -n "$jar"
          java -Duser.timezone=UTC -Dojp.libs.path=./ojp-libs \
            -jar "$jar" > /tmp/ojp-client-python-dbapi-server.log 2>&1 &
          echo "$!" > /tmp/ojp-client-python-dbapi-server.pid
          for i in $(seq 1 60); do
            if grep -q "OJP gRPC Server started" /tmp/ojp-client-python-dbapi-server.log; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/ojp-client-python-dbapi-server.pid)" 2>/dev/null; then
              cat /tmp/ojp-client-python-dbapi-server.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/ojp-client-python-dbapi-server.log
          exit 1

      - name: Run all Python unit and H2 integration tests
        working-directory: ojp-client-python-dbapi
        env:
          OJP_TEST_H2: 'true'
          OJP_TEST_H2_ADDR: localhost:1059
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/ojp-client-python-dbapi-tests.log

      - name: Stop OJP server
        if: always()
        run: |
          if test -f /tmp/ojp-client-python-dbapi-server.pid; then
            kill "$(cat /tmp/ojp-client-python-dbapi-server.pid)" || true
          fi

      - name: Save Python test results and server log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: python-h2-l1-test-results
          path: |
            /tmp/ojp-client-python-dbapi-tests.log
            /tmp/ojp-client-python-dbapi-server.log
          retention-days: 7

  # ===========================================================================
  # JOB 2: PostgreSQL Integration Tests
  # ===========================================================================
  #
  # This job tests PostgreSQL database integration.
  # PostgreSQL is a popular open-source database with excellent JDBC support
  # and XA transaction capabilities.
  #
  # Database: PostgreSQL 17
  # Matrix strategy: Tests against Java 11, 17, 21, 25
  # Execution: Runs after all selected Main CI H2 jobs succeed.
  #
  # SQL Enhancer Testing:
  # All PostgreSQL tests run twice per matrix configuration:
  # 1. Against standard OJP server (port 1059, SQL enhancer disabled)
  # 2. Against OJP server with SQL enhancer enabled (port 10593)
  # This ensures compatibility with both configurations.
  #
  # ===========================================================================
  postgres-test:
    name: PostgreSQL Tests (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    # DEPENDENCY: This job waits until every selected Main CI H2 job succeeds.
    needs: [detect-changes, h2-integration-gate, resolve-version]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java == 'true' && needs.h2-integration-gate.result == 'success' && needs.resolve-version.result == 'success' }}

    strategy:
      fail-fast: false
      matrix:
        java-version: [ 11, 17, 21, 25 ]

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Start PostgreSQL container with XA transaction support
      - name: Start Postgres
        run: |
          docker run --name ojp-postgres \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=defaultdb \
            -p 5432:5432 \
            -d postgres:17 \
            -c max_prepared_transactions=100
      
          # Wait for Postgres to become ready (up to 60s)
          timeout 60 bash -c 'until docker exec ojp-postgres pg_isready -U testuser -d defaultdb -h 127.0.0.1; do sleep 2; done'

          # Verify setting
          PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SHOW max_prepared_transactions;"

      - name: Set up JDK 25 for build
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons) with JDK 25
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Test (ojp-grpc-commons) with JDK 25
        run: mvn test -pl ojp-grpc-commons -Dgpg.skip=true

      # Download open source JDBC drivers into ojp-server/ojp-libs for inclusion in the Docker image
      - name: Download Open Source Drivers
        run: bash ojp-server/download-drivers.sh ./ojp-server/ojp-libs

      - name: Build (ojp-server) with JDK 25
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Build OJP Server Docker image
        run: |
          docker build -t ${{ needs.resolve-version.outputs.ojp_image }} ojp-server/
          echo "OJP_IMAGE=${{ needs.resolve-version.outputs.ojp_image }}" >> $GITHUB_ENV

      # Start first OJP server without SQL enhancer (default configuration)
      # Tests will run against this server via postgres_connection.csv (port 1059)
      - name: Start OJP Server container
        run: |
          docker run -d --name ojp-server \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.slowQuerySegregation.enabled=true" \
            ${{ env.OJP_IMAGE }}

      # Start second OJP server WITH SQL enhancer enabled in OPTIMIZE mode
      # Tests will run against this server via postgres_connection.csv (port 10593)
      # OPTIMIZE mode enables conversion and optimization with schema loading support
      # PostgreSQL dialect ensures proper SQL parsing and validation
      # This ensures all PostgreSQL tests validate both configurations
      - name: Start OJP Server container (SQL enhancer on port 10593)
        run: |
          docker run -d --name ojp-server-enhancer \
            --network host \
            -e JAVA_TOOL_OPTIONS="-Dojp.server.port=10593 -Dojp.prometheus.port=9163 -Dojp.server.slowQuerySegregation.enabled=true -Dojp.sql.enhancer.enabled=true -Dojp.sql.enhancer.mode=OPTIMIZE -Dojp.sql.enhancer.dialect=POSTGRESQL" \
            ${{ env.OJP_IMAGE }}

      - name: Wait for ojp-server to start
        run: sleep 10

      - name: Set up JDK ${{ matrix.java-version }} for ojp-jdbc-driver
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build (ojp-jdbc-driver) with JDK ${{ matrix.java-version }}
        run: mvn clean install -pl ojp-jdbc-driver -am -DskipTests -Dgpg.skip=true

      # Run PostgreSQL-specific tests with -DenablePostgresTests flag
      - name: Test (ojp-jdbc-driver) with PostgreSQL enabled
        run: mvn test -pl ojp-jdbc-driver -Dgpg.skip=true -DenablePostgresTests=true

      # ===================================================================
      # SQL Enhancer Integration Test
      # ===================================================================
      # This test validates the SQL enhancer functionality by:
      # 1. Setting up test data in PostgreSQL
      # 2. Starting two OJP servers on random ports (one with SQL enhancer enabled, one without)
      # 3. Running a complex query on both servers
      # 4. Verifying identical results and comparing performance
      # 5. Stopping both test servers after completion
      # ===================================================================

      - name: Run SQL Enhancer Integration Test
        run: |
          mvn test -pl ojp-jdbc-driver -Dgpg.skip=true \
            -Dtest=PostgresSqlEnhancerIntegrationTest \
            -DenableSqlEnhancerIntegrationTest=true \
            -Dpostgres.host=localhost \
            -Dpostgres.port=5432 \
            -Dpostgres.db=defaultdb \
            -Dpostgres.user=testuser \
            -Dpostgres.password=testpassword

      - name: Show ojp-server.log
        if: always()
        run: |
          echo "=== OJP Server (default) log ==="
          docker logs ojp-server 2>&1 || echo "ojp-server container not found"
          echo ""
          echo "=== OJP Server (with SQL enhancer) log ==="
          docker logs ojp-server-enhancer 2>&1 || echo "ojp-server-enhancer container not found"

  # ===========================================================================
  # JOB 3: MySQL Integration Tests
  # ===========================================================================
  #
  # This job tests MySQL database integration.
  # MySQL is one of the most widely used open-source databases.
  #
  # Database: MySQL 8.0
  # Matrix strategy: Tests against Java 11, 17, 21, 25
  # Execution: Runs after all selected Main CI H2 jobs succeed.
  #
  # ===========================================================================
  mysql-test:
    name: MySQL Tests (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    # DEPENDENCY: This job waits until every selected Main CI H2 job succeeds.
    needs: [detect-changes, h2-integration-gate, resolve-version]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java == 'true' && needs.h2-integration-gate.result == 'success' && needs.resolve-version.result == 'success' }}

    strategy:
      fail-fast: false
      matrix:
        java-version: [ 11, 17, 21, 25 ]

    services:
      # MySQL database service container
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: defaultdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
          MYSQL_ROOT_PASSWORD: rootpassword
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25 for build
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons) with JDK 25
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Test (ojp-grpc-commons) with JDK 25
        run: mvn test -pl ojp-grpc-commons -Dgpg.skip=true

      # Download open source JDBC drivers into ojp-server/ojp-libs for inclusion in the Docker image
      - name: Download Open Source Drivers
        run: bash ojp-server/download-drivers.sh ./ojp-server/ojp-libs

      - name: Build (ojp-server) with JDK 25
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Build OJP Server Docker image
