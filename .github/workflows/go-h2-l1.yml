# =============================================================================
# Go H2 L1 Integration
# =============================================================================
#
# This workflow builds the OJP server, starts it with the embedded H2 database,
# and runs the Go client against it.
#
# This runs as a separate workflow so it is independently triggerable and does
# not affect the Java-based H2 fail-fast job in main.yml.
#
# =============================================================================

name: Go H2 L1 Integration

on:
  push:
    branches: [ main, 'lts/**' ]
  pull_request:
    branches: [ main, 'lts/**' ]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full CI suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ./.github/workflows/ci-test-selection.yml
    with:
      full-suite: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}

  go-h2-l1-integration:
    name: Go H2 L1 Integration
    needs: detect-changes
    if: needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons)
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Download open source JDBC drivers
        run: bash ojp-server/download-drivers.sh ./ojp-libs

      - name: Build (ojp-server)
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'

      - name: Check Go protobuf generation
        run: ./generate-proto.sh --check
        working-directory: ojp-client-go-database-sql

      - name: Start OJP server (background)
        run: |
          jar=$(ls ojp-server/target/ojp-server-*-shaded.jar | head -1)
          java -Duser.timezone=UTC -Dojp.libs.path=./ojp-libs \
            -jar "$jar" &>/tmp/ojp-server.log &
          echo "OJP server PID=$!"

      - name: Wait for OJP server to start
        run: |
          for i in $(seq 1 30); do
            if grep -q "OJP gRPC Server started" /tmp/ojp-server.log 2>/dev/null; then
              echo "OJP server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for OJP server. Log:"; cat /tmp/ojp-server.log
          exit 1

      - name: Run Go unit and H2 L1 integration tests
        env:
          OJP_TEST_H2: 'true'
          OJP_TEST_H2_ADDR: 'localhost:1059'
        run: go test -count=1 -json ./... | tee /tmp/go-h2-l1-test.json
        working-directory: ojp-client-go-database-sql

      - name: Run Go H2 L1 CRUD CLI smoke test
        env:
          OJP_JDBC_LINE: 'jdbc:ojp[localhost:1059]_h2:mem:ojp_go_h2_l1;DB_CLOSE_DELAY=-1,sa,'
        run: go run ./cmd/ojp-client
        working-directory: ojp-client-go-database-sql

      - name: Show ojp-server.log
        if: always()
        run: cat /tmp/ojp-server.log

      - name: Save H2 L1 test report and server log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: go-h2-l1-test-results
          path: |
            /tmp/go-h2-l1-test.json
            /tmp/ojp-server.log
          retention-days: 7

  go-ci-result:
    name: Go CI Result
    needs: [detect-changes, go-h2-l1-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected suite result
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.detect-changes.outputs.go }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const selected = process.env.SELECTED;
          const result = needs['go-h2-l1-integration'].result;
          if (needs['detect-changes'].result !== 'success' ||
              !['true', 'false'].includes(selected) ||
              (selected === 'true' && result !== 'success') ||
              (selected === 'false' && !['skipped', 'success'].includes(result))) {
            console.error('Go CI failed:', JSON.stringify(needs), 'selected:', selected);
            process.exit(1);
          }
          console.log(selected === 'true' ? 'Go suite passed.' : 'Go suite not selected.');
          NODE
