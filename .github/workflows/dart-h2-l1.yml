# =============================================================================
# Dart H2 L1 Integration
# =============================================================================
#
# This workflow builds the OJP server, starts it with the embedded H2 database,
# and runs the Dart client against it.
#
# =============================================================================

name: Dart H2 L1 Integration

on:
  push:
    branches: [ main, 'lts/**' ]
  pull_request:
    branches: [ main, 'lts/**' ]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full CI suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ./.github/workflows/ci-test-selection.yml
    with:
      full-suite: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}

  dart-h2-l1-integration:
    name: Dart H2 L1 Integration
    needs: detect-changes
    if: needs.detect-changes.outputs.dart == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons)
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Download open source JDBC drivers
        run: bash ojp-server/download-drivers.sh ./ojp-libs

      - name: Build (ojp-server)
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Start OJP server (background)
        run: |
          jar=$(ls ojp-server/target/ojp-server-*-shaded.jar | head -1)
          java -Duser.timezone=UTC -Dojp.libs.path=./ojp-libs \
            -jar "$jar" &>/tmp/ojp-server.log &
          echo "OJP server PID=$!"

      - name: Wait for OJP server to start
        run: |
          for i in $(seq 1 30); do
            if grep -q "OJP gRPC Server started" /tmp/ojp-server.log 2>/dev/null; then
              echo "OJP server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for OJP server. Log:"
          cat /tmp/ojp-server.log
          exit 1

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: '3.13.5'

      - name: Check Dart formatting and analysis
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test
          dart analyze
        working-directory: ojp-client-dart-drift

      - name: Run Dart H2 L1 integration tests
        env:
          OJP_TEST_H2: 'true'
          OJP_TEST_H2_ADDR: 'localhost:1059'
        run: dart test --reporter=expanded
        working-directory: ojp-client-dart-drift

      - name: Show ojp-server.log
        if: always()
        run: cat /tmp/ojp-server.log

      - name: Save Dart H2 L1 server log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dart-h2-l1-test-results
          path: /tmp/ojp-server.log
          retention-days: 7

  dart-ci-result:
    name: Dart CI Result
    needs: [detect-changes, dart-h2-l1-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected suite result
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.detect-changes.outputs.dart }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const selected = process.env.SELECTED;
          const result = needs['dart-h2-l1-integration'].result;
          if (needs['detect-changes'].result !== 'success' ||
              !['true', 'false'].includes(selected) ||
              (selected === 'true' && result !== 'success') ||
              (selected === 'false' && !['skipped', 'success'].includes(result))) {
            console.error('Dart CI failed:', JSON.stringify(needs), 'selected:', selected);
            process.exit(1);
          }
          console.log(selected === 'true' ? 'Dart suite passed.' : 'Dart suite not selected.');
          NODE
