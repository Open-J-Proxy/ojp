name: Ruby DBI L1 Test (H2)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ruby-h2-l1:
    name: Ruby DBI L1 integration test against H2
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Download open source JDBC drivers
        run: bash ojp-server/download-drivers.sh ./ojp-libs

      - name: Build OJP server
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true
          working-directory: ojp-grpc-client-ruby

      - name: Verify generated Ruby protocol bindings
        run: ./generate-proto.sh --check
        working-directory: ojp-grpc-client-ruby

      - name: Start OJP server
        run: |
          jar=$(ls ojp-server/target/ojp-server-*-shaded.jar | head -1)
          java -Duser.timezone=UTC -Dojp.libs.path=./ojp-libs \
            -jar "$jar" &>/tmp/ojp-server.log &
          echo "OJP server PID=$!"

      - name: Wait for OJP server
        run: |
          for i in $(seq 1 30); do
            if grep -q "OJP gRPC Server started" /tmp/ojp-server.log 2>/dev/null; then
              echo "OJP server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for OJP server. Log:"
          cat /tmp/ojp-server.log
          exit 1

      - name: Run Ruby unit and H2 L1 integration tests
        env:
          OJP_TEST_H2: 'true'
          OJP_TEST_H2_ADDR: 'localhost:1059'
        run: bundle exec ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].each { |file| require_relative file }'
        working-directory: ojp-grpc-client-ruby

      - name: Show OJP server log
        if: always()
        run: cat /tmp/ojp-server.log
